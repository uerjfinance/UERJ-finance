name: Atualizar cotações

on:
  schedule:
    # Dias úteis, 12:00 e 20:00 de Brasília (UTC-3) = 15:00 e 23:00 UTC.
    # O GitHub pode atrasar a execução em alguns minutos nos horários de pico.
    - cron: "0 15 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}   # botão "Run workflow" para rodar manualmente

permissions:
  contents: write

concurrency:
  group: cotacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt
      - run: pip install -r agente/requirements.txt
      - name: Buscar cotações no Yahoo Finance
        run: python agente/atualizar_cotacoes.py --fonte yahoo --universo config/universo.json --saida dados/cotacoes.json
      - name: Publicar se houve mudança
        run: |
          if git diff --quiet -- dados/cotacoes.json && [ -z "$(git ls-files --others -- dados/cotacoes.json)" ]; then
            echo "Sem alterações."; exit 0
          fi
          git config user.name "agente-uerj-finance"
          git config user.email "agente-uerj-finance@users.noreply.github.com"
          git add dados/cotacoes.json
          git commit -m "Cotações de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push
